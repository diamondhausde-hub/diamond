<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com; connect-src https://api.github.com; base-uri 'none'; form-action 'none'"
    />
    <title>DIAMOND — لوحة التحكم</title>
    <style>
      :root {
        --navy: #0b2545;
        --emerald: #1d8a4e;
        --gold: #f5b700;
        --ink: #182538;
        --muted: #64748b;
        --line: #e1e8f0;
        --line-strong: #cbd5e1;
        --ice: #f4f7fa;
        --danger: #b42318;
        --ok: #14663a;
        --radius: 4px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--ice);
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      a { color: var(--emerald); }
      .hidden { display: none !important; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }

      /* Login */
      .login-wrap {
        min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 24px 18px; background: var(--navy);
      }
      .login-card {
        width: 100%; max-width: 460px; background: #fff; padding: 30px 26px;
        border-top: 3px solid var(--gold);
      }
      .brand { display: flex; align-items: center; gap: 10px; color: var(--navy); font-weight: 700; letter-spacing: .08em; }
      .brand-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--emerald); position: relative; flex: none; }
      .brand-mark::after {
        content: ""; position: absolute; inset: 7px; border: 2px solid #fff;
        transform: rotate(45deg); border-radius: 1px;
      }
      .login-card h1 { font-size: 21px; margin: 22px 0 4px; color: var(--navy); }
      .login-card p.hint { color: var(--muted); font-size: 12px; margin: 0 0 22px; }
      details.help { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; }
      details.help summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--navy); }
      details.help ol { font-size: 12px; color: var(--muted); padding-inline-start: 18px; }

      /* Layout */
      .app { min-height: 100dvh; display: flex; }
      .side {
        display: none; width: 232px; flex: none; background: var(--navy); color: #fff;
        padding: 22px 14px; position: sticky; top: 0; height: 100dvh;
      }
      @media (min-width: 900px) { .side { display: flex; flex-direction: column; } }
      .side .brand { color: #fff; padding: 0 10px 20px; border-bottom: 1px solid rgba(255,255,255,.14); }
      .nav-list { display: flex; flex-direction: column; gap: 2px; margin-top: 16px; }
      .nav-item {
        display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent;
        color: rgba(255,255,255,.72); text-align: start; padding: 11px 12px; border-radius: var(--radius);
        font-size: 13px;
      }
      .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
      .nav-item.active { background: var(--emerald); color: #fff; }
      .nav-item .ico { width: 18px; text-align: center; opacity: .9; }
      .side-foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,.14); padding-top: 14px; }
      .side-foot button { width: 100%; margin-bottom: 6px; }
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .topbar {
        background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px;
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        position: sticky; top: 0; z-index: 20;
      }
      .topbar h2 { font-size: 15px; margin: 0; color: var(--navy); }
      .topbar-actions { display: flex; gap: 6px; align-items: center; }
      .content { padding: 18px 16px 96px; max-width: 1100px; width: 100%; margin: 0 auto; }
      @media (min-width: 900px) { .content { padding-bottom: 30px; } }

      .bottom {
        position: fixed; inset-inline: 0; bottom: 0; z-index: 30; background: #fff;
        border-top: 1px solid var(--line); display: flex; justify-content: space-around;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (min-width: 900px) { .bottom { display: none; } }
      .bottom button {
        flex: 1; min-width: 0; border: 0; background: transparent; color: var(--muted);
        padding: 8px 2px 7px; font-size: 10px; display: flex; flex-direction: column;
        align-items: center; gap: 2px;
      }
      .bottom button.active { color: var(--emerald); }
      .bottom .ico { font-size: 17px; line-height: 1; }

      /* Common UI */
      .btn {
        border: 1px solid var(--navy); background: var(--navy); color: #fff; border-radius: var(--radius);
        padding: 9px 14px; font-size: 12px; font-weight: 600; min-height: 40px;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      }
      .btn:hover { opacity: .9; }
      .btn:disabled { opacity: .5; cursor: not-allowed; }
      .btn.primary { background: var(--emerald); border-color: var(--emerald); }
      .btn.ghost { background: #fff; color: var(--navy); }
      .btn.danger { background: #fff; color: var(--danger); border-color: #e2a9a3; }
      .btn.small { min-height: 32px; padding: 5px 9px; font-size: 11px; }
      .btn.big { min-height: 52px; font-size: 15px; width: 100%; }
      .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
      .field label { font-size: 11px; color: var(--muted); font-weight: 600; }
      .field input, .field select, .field textarea {
        width: 100%; border: 1px solid var(--line-strong); background: #fff; color: var(--ink);
        padding: 9px 10px; min-height: 42px; border-radius: var(--radius); outline: none;
      }
      .field textarea { min-height: 84px; resize: vertical; }
      .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--emerald); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .grid { display: grid; gap: 12px; }
      @media (min-width: 700px) { .grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); } .grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); } }
      .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
      .card + .card { margin-top: 12px; }
      .card h3 { margin: 0 0 10px; font-size: 14px; color: var(--navy); }
      .muted { color: var(--muted); font-size: 12px; }
      .tiny { font-size: 11px; }
      .badge { display: inline-block; background: var(--gold); color: var(--navy); border-radius: 99px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
      .badge.green { background: var(--emerald); color: #fff; }
      .pill { border: 1px solid var(--line-strong); border-radius: 99px; padding: 4px 9px; font-size: 11px; background: #fff; }
      .notice { border-inline-start: 3px solid var(--emerald); background: #f0f8f3; color: var(--ok); padding: 9px 11px; font-size: 12px; margin: 10px 0; }
      .notice.warn { border-color: var(--gold); background: #fffaf0; color: #8a5a00; }
      .notice.error { border-color: var(--danger); background: #fdf2f0; color: var(--danger); }
      .tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 14px; }
      .tabs button { border: 0; background: transparent; white-space: nowrap; padding: 7px 10px; font-size: 12px; color: var(--muted); border-radius: var(--radius); }
      .tabs button.active { background: var(--navy); color: #fff; }
      .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); margin-inline-start: 4px; }
      .switch { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; cursor: pointer; }
      .switch input { width: 18px; height: 18px; accent-color: var(--emerald); }

      .list-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .list-row:last-child { border-bottom: 0; }
      .thumb { width: 52px; height: 52px; flex: none; object-fit: cover; background: var(--ice); border: 1px solid var(--line); }
      .grow { flex: 1; min-width: 0; }
      .title-line { font-weight: 600; color: var(--navy); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
      .stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
      @media (min-width: 700px) { .stats { grid-template-columns: repeat(3,1fr); } }
      .stat { background: #fff; border: 1px solid var(--line); padding: 14px; }
      .stat b { display: block; font-size: 25px; color: var(--navy); line-height: 1.2; }
      .stat span { font-size: 11px; color: var(--muted); }

      .images { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
      @media (min-width: 700px) { .images { grid-template-columns: repeat(4, minmax(0,1fr)); } }
      .image-card { border: 1px solid var(--line); background: #fff; }
      .image-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--ice); }
      .image-card .meta { padding: 7px; font-size: 10px; color: var(--muted); word-break: break-all; }
      .image-card .actions { padding: 0 7px 7px; }

      details.tree { border: 1px solid var(--line); background: #fff; margin-bottom: 6px; }
      details.tree > summary { cursor: pointer; padding: 10px 12px; font-weight: 600; color: var(--navy); font-size: 12px; }
      .tree-body { padding: 0 12px 12px; border-top: 1px solid var(--line); }
      .leaf { padding: 10px 0; border-bottom: 1px solid var(--line); }
      .leaf:last-child { border-bottom: 0; }
      .leaf .path { font-family: Consolas, monospace; font-size: 10px; color: var(--muted); word-break: break-all; }
      .leaf .ref { font-size: 12px; color: var(--ink); background: var(--ice); padding: 6px 8px; margin: 4px 0; white-space: pre-wrap; }
      .leaf textarea { min-height: 46px; }
      .leaf .warn { color: var(--danger); font-size: 10px; }

      .modal-backdrop {
        position: fixed; inset: 0; z-index: 60; background: rgba(11,37,69,.55);
        display: flex; align-items: flex-end; justify-content: center; padding: 0;
      }
      @media (min-width: 700px) { .modal-backdrop { align-items: center; padding: 20px; } }
      .modal {
        background: #fff; width: 100%; max-width: 720px; max-height: 92dvh; overflow: auto;
        padding: 18px; border-top: 3px solid var(--gold);
      }
      @media (min-width: 700px) { .modal { border-radius: var(--radius); } }
      .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
      .modal-head h3 { margin: 0; font-size: 16px; color: var(--navy); }
      .modal-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

      #toast {
        position: fixed; inset-inline: 12px; bottom: 78px; z-index: 80; display: flex;
        flex-direction: column; gap: 6px; align-items: center; pointer-events: none;
      }
      @media (min-width: 900px) { #toast { bottom: 18px; } }
      .toast { background: var(--navy); color: #fff; padding: 9px 14px; font-size: 12px; border-radius: var(--radius); max-width: 520px; }
      .toast.err { background: var(--danger); }
      .toast.ok { background: var(--emerald); }
    </style>
  </head>
  <body>
    <div id="loginView" class="login-wrap"></div>

    <div id="appView" class="app hidden">
      <aside class="side">
        <div class="brand"><span class="brand-mark"></span><span>DIAMOND</span></div>
        <div id="sideNav" class="nav-list"></div>
        <div class="side-foot">
          <button class="btn ghost small" id="btnLogoutSide" type="button">تسجيل الخروج</button>
          <button class="btn danger small" id="btnForgetSide" type="button">نسيان هذا الجهاز</button>
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <h2 id="screenTitle">لوحة التحكم</h2>
          <div class="topbar-actions">
            <span id="changeBadge" class="badge hidden">0</span>
            <button class="btn ghost small" id="btnLogoutTop" type="button">خروج</button>
          </div>
        </header>
        <main class="content" id="screens">
          <section class="screen" id="screen-dashboard"></section>
          <section class="screen hidden" id="screen-products"></section>
          <section class="screen hidden" id="screen-categories"></section>
          <section class="screen hidden" id="screen-texts"></section>
          <section class="screen hidden" id="screen-images"></section>
          <section class="screen hidden" id="screen-settings"></section>
          <section class="screen hidden" id="screen-publish"></section>
          <section class="screen hidden" id="screen-history"></section>
        </main>
      </div>
      <nav class="bottom" id="bottomNav"></nav>
    </div>

    <div id="modalRoot"></div>
    <div id="toast" aria-live="polite"></div>

    <script>
      "use strict";

      /* ─────────────────────────── Constants ─────────────────────────── */
      const OWNER = "diamondhausde-hub";
      const REPO = "diamond";
      const BRANCH = "main";
      const API = "https://api.github.com";
      const LIVE = "https://diamondhausde-hub.github.io/diamond/";
      const ACTIONS = "https://github.com/" + OWNER + "/" + REPO + "/actions";
      const ENC_KEY = "diamond.admin.encrypted";
      const DRAFT_KEY = "diamond.admin.draft";

      const LOCALES = [
        { code: "en", label: "English", dir: "ltr" },
        { code: "ar", label: "العربية", dir: "rtl" },
        { code: "de", label: "Deutsch", dir: "ltr" },
        { code: "fr", label: "Français", dir: "ltr" },
        { code: "it", label: "Italiano", dir: "ltr" },
        { code: "zh", label: "中文", dir: "ltr", lang: "zh-Hans" }
      ];
      const PATHS = {
        products: "data/products.json",
        categories: "data/categories.json",
        settings: "config/site.json",
        messages: LOCALES.map((l) => "messages/" + l.code + ".json")
      };
      const VISUALS = ["glassCloth", "windowSqueegee", "floorSqueegee", "floorMop", "brushesBrooms", "wasteBags"];
      const ALL_JSON_PATHS = [PATHS.products, PATHS.categories, PATHS.settings, ...PATHS.messages];

      const SCREENS = [
        { id: "dashboard", title: "لوحة التحكم", icon: "⌂", label: "الرئيسية" },
        { id: "products", title: "المنتجات", icon: "▣", label: "المنتجات" },
        { id: "categories", title: "الفئات والفلاتر", icon: "≡", label: "الفئات" },
        { id: "texts", title: "النصوص", icon: "✎", label: "النصوص" },
        { id: "images", title: "الصور", icon: "▧", label: "الصور" },
        { id: "settings", title: "الإعدادات", icon: "⚙", label: "الإعدادات" },
        { id: "publish", title: "النشر", icon: "↑", label: "النشر" },
        { id: "history", title: "السجل", icon: "◷", label: "السجل" }
      ];
      const MOBILE_TABS = ["dashboard", "products", "texts", "images", "more"];

      const state = {
        token: null,
        authed: false,
        wrong: 0,
        lockUntil: 0,
        lastActivity: Date.now(),
        files: {},
        images: [],
        pendingUploads: [],
        imageDeletions: [],
        changes: [],
        currentScreen: "dashboard",
        textsLang: "en",
        textsQuery: "",
        textsMissingOnly: false,
        productsFilter: ""
      };

      /* ─────────────────────────── DOM helpers ─────────────────────────── */
      function h(tag, props, ...children) {
        const node = document.createElement(tag);
        props = props || {};
        for (const key of Object.keys(props)) {
          const value = props[key];
          if (value === null || value === undefined || value === false) continue;
          if (key === "class") node.className = value;
          else if (key === "text") node.textContent = value;
          else if (key === "dir") node.dir = value;
          else if (key === "lang") node.lang = value;
          else if (key === "value") node.value = value;
          else if (key === "checked") node.checked = Boolean(value);
          else if (key === "disabled") node.disabled = Boolean(value);
          else if (key.slice(0, 2) === "on" && typeof value === "function") {
            node.addEventListener(key.slice(2).toLowerCase(), value);
          } else node.setAttribute(key, value === true ? "" : value);
        }
        appendChildren(node, children);
        return node;
      }
      function appendChildren(node, children) {
        for (const child of children.flat()) {
          if (child === null || child === undefined || child === false) continue;
          node.append(child.nodeType ? child : document.createTextNode(String(child)));
        }
      }
      function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
      function toast(message, kind) {
        const box = h("div", { class: "toast" + (kind ? " " + kind : ""), text: message });
        document.getElementById("toast").append(box);
        setTimeout(() => box.remove(), 4200);
      }
      function modal(title, body, foot) {
        const root = document.getElementById("modalRoot");
        clear(root);
        const panel = h("div", { class: "modal" },
          h("div", { class: "modal-head" },
            h("h3", { text: title }),
            h("button", { class: "btn ghost small", type: "button", text: "إغلاق", onclick: closeModal })
          ),
          body,
          foot ? h("div", { class: "modal-foot" }, foot) : null
        );
        const backdrop = h("div", { class: "modal-backdrop", onclick: (e) => { if (e.target === backdrop) closeModal(); } }, panel);
        root.append(backdrop);
      }
      function closeModal() { clear(document.getElementById("modalRoot")); }
      function confirmAsk(title, message, onYes, yesLabel) {
        modal(title, h("p", { class: "muted", text: message }), [
          h("button", { class: "btn ghost", type: "button", text: "إلغاء", onclick: closeModal }),
          h("button", {
            class: "btn danger", type: "button", text: yesLabel || "تأكيد",
            onclick: () => { closeModal(); onYes(); }
          })
        ]);
      }

      /* ───────────────────── Token encryption helpers ─────────────────── */
      function bytesToB64(bytes) {
        let binary = "";
        for (const b of bytes) binary += String.fromCharCode(b);
        return btoa(binary);
      }
      function b64ToBytes(value) {
        const binary = atob(String(value).replace(/\s/g, ""));
        const out = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
        return out;
      }
      async function deriveKey(password, salt) {
        const base = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: 600000, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }
      async function encryptToken(token, password) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(password, salt);
        const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(token));
        localStorage.setItem(ENC_KEY, JSON.stringify({
          v: 1, salt: bytesToB64(salt), iv: bytesToB64(iv), ciphertext: bytesToB64(new Uint8Array(cipher))
        }));
      }
      function storedEncrypted() {
        try { return JSON.parse(localStorage.getItem(ENC_KEY) || "null"); }
        catch (_) { return null; }
      }
      async function decryptToken(password) {
        const record = storedEncrypted();
        if (!record || !record.salt || !record.iv || !record.ciphertext) throw new Error("لا يوجد توكن محفوظ على هذا الجهاز.");
        const key = await deriveKey(password, b64ToBytes(record.salt));
        const plain = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(record.iv) }, key, b64ToBytes(record.ciphertext)
        );
        return new TextDecoder().decode(plain);
      }

      /* ─────────────────────────── GitHub API ─────────────────────────── */
      class ApiError extends Error {
        constructor(message, status, conflict) {
          super(message);
          this.status = status || 0;
          this.conflict = Boolean(conflict);
        }
      }
      async function ghFetch(path, options, token) {
        const headers = Object.assign(
          {
            Authorization: "Bearer " + (token || state.token || ""),
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
          },
          (options && options.headers) || {}
        );
        let response;
        try {
          response = await fetch(API + path, Object.assign({}, options || {}, { headers: headers }));
        } catch (error) {
          throw new ApiError("تعذّر الاتصال بـ GitHub. تحقّق من الإنترنت.", 0);
        }
        if (response.status === 401) {
          const error = new ApiError("التوكن غير صالح أو منتهي. سجّل الدخول من جديد.", 401);
          if (state.authed) lockSession();
          throw error;
        }
        if (response.status === 403) {
          throw new ApiError("لا صلاحية كافية أو تجاوزت حد الطلبات. راجع صلاحيات التوكن.", 403);
        }
        if (response.status === 404) {
          throw new ApiError("الملف أو المستودع غير موجود (404).", 404);
        }
        if (response.status === 409 || response.status === 422) {
          throw new ApiError("تعارض في الحفظ: الملف تغيّر من مكان ثاني.", response.status, true);
        }
        if (!response.ok) {
          throw new ApiError("طلب GitHub فشل (" + response.status + ").", response.status);
        }
        if (response.status === 204) return null;
        return response.json();
      }
      async function verifyToken(token) {
        const data = await ghFetch("/repos/" + OWNER + "/" + REPO, {}, token);
        if (!data.permissions || data.permissions.push !== true) {
          throw new ApiError("التوكن ما عنده صلاحية الكتابة.", 403);
        }
        return data;
      }
      async function readFile(path, ref) {
        const url = "/repos/" + OWNER + "/" + REPO + "/contents/" + path +
          "?ref=" + encodeURIComponent(ref || BRANCH);
        const data = await ghFetch(url);
        const text = new TextDecoder().decode(b64ToBytes(data.content || ""));
        return { json: JSON.parse(text), sha: data.sha, text: text };
      }
      async function listDir(path) {
        const data = await ghFetch("/repos/" + OWNER + "/" + REPO + "/contents/" + path + "?ref=" + BRANCH);
        return (data || []).map((entry) => ({
          name: entry.name,
          path: entry.path,
          sha: entry.sha
        }));
      }
      async function getRecentCommits() {
        return ghFetch("/repos/" + OWNER + "/" + REPO + "/commits?per_page=15");
      }
      async function commitMany(changes, message) {
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const ref = await ghFetch("/repos/" + OWNER + "/" + REPO + "/git/ref/heads/" + BRANCH);
            const latest = ref.object.sha;
            const base = await ghFetch("/repos/" + OWNER + "/" + REPO + "/git/commits/" + latest);
            const entries = [];
            for (const change of changes) {
              if (change.remove) {
                entries.push({ path: change.path, mode: "100644", type: "blob", sha: null });
                continue;
              }
              const blob = await ghFetch("/repos/" + OWNER + "/" + REPO + "/git/blobs", {
                method: "POST",
                body: JSON.stringify({ content: change.content, encoding: change.encoding })
              });
              entries.push({ path: change.path, mode: "100644", type: "blob", sha: blob.sha });
            }
            const tree = await ghFetch("/repos/" + OWNER + "/" + REPO + "/git/trees", {
              method: "POST",
              body: JSON.stringify({ base_tree: base.tree.sha, tree: entries })
            });
            const commit = await ghFetch("/repos/" + OWNER + "/" + REPO + "/git/commits", {
              method: "POST",
              body: JSON.stringify({ message: message, parents: [latest], tree: tree.sha })
            });
            await ghFetch("/repos/" + OWNER + "/" + REPO + "/git/refs/heads/" + BRANCH, {
              method: "PATCH",
              body: JSON.stringify({ sha: commit.sha, force: false })
            });
            return commit;
          } catch (error) {
            if (error.conflict && attempt === 0) continue;
            throw error;
          }
        }
      }

      function moveProduct(product, delta) {
        const products = productsArray().slice().sort((a, b) => a.order - b.order);
        const index = products.findIndex((p) => p.id === product.id);
        const target = index + delta;
        if (target < 0 || target >= products.length) return;
        const temp = products[index];
        products[index] = products[target];
        products[target] = temp;
        products.forEach((p, i) => { p.order = i + 1; });
        productsArray().splice(0, productsArray().length, ...products);
        addChange("edit", "ترتيب المنتجات", PATHS.products);
        renderProducts();

      function deleteProduct(product) {
        const usedImages = [product.image, ...(product.gallery || [])].filter(Boolean);

        const body = h("div", {},
          h("p", { class: "muted", text: "سيُحذف المنتج وكل نصوصه من اللغات الست. هل أنت متأكد؟" }),

      function imageUrl(path) {

      function editProduct(id) {

        if (!product) return;
        const draft = JSON.parse(JSON.stringify(product));
        const copy = {};
        PATHS.messages.forEach((path) => {
          const code = path.split("/")[1].split(".")[0];

            item = { name: "", short: "", detail: "", highlight: "", specs: [{ label: "", value: "" }] };
            state.files[path].json.products.items[product.id] = item;
          }

      /* ─────────────────────────── Texts ─────────────────────────── */
      function walkLeaves(value, prefix, out) {
        if (Array.isArray(value)) {
          value.forEach((item, index) => walkLeaves(item, prefix ? prefix + "." + index : String(index), out));
        } else if (value && typeof value === "object") {
          Object.keys(value).forEach((key) => {
            const path = prefix ? prefix + "." + key : key;
            walkLeaves(value[key], path, out);
          });
        } else {
          out.push({ path: prefix, value: value });
        }
      }
      function getByPath(root, path) {
        return String(path).split(".").reduce((node, key) => (node == null ? undefined : node[key]), root);
      }
      function setByPath(root, path, value) {
        const parts = String(path).split(".");
        let node = root;
        for (let i = 0; i < parts.length - 1; i++) node = node[parts[i]];
        node[parts[parts.length - 1]] = value;
      }
      function leafPaths(root) {
        const leaves = [];
        walkLeaves(root, "", leaves);
        return leaves;
      }
      function placeholders(text) {
        const out = [];
        const regex = /\{([^}]+)\}/g;
        let match;
        while ((match = regex.exec(String(text || "")))) out.push(match[1]);
        return out;
      }
      function renderTexts() {
        const node = document.getElementById("screen-texts");
        clear(node);
        const langSelect = h("select", {});
        LOCALES.forEach((locale) => langSelect.append(h("option", { value: locale.code, text: locale.label })));
        langSelect.value = state.textsLang;
        langSelect.onchange = () => { state.textsLang = langSelect.value; renderTexts(); };
        const search = h("input", { type: "search", placeholder: "ابحث في المفاتيح أو النصوص...", value: state.textsQuery });
        search.oninput = () => { state.textsQuery = search.value; renderTexts(); };
        const onlyMissing = h("input", { type: "checkbox", checked: state.textsMissingOnly });
        onlyMissing.onchange = () => { state.textsMissingOnly = onlyMissing.checked; renderTexts(); };
        node.append(h("div", { class: "card" },
          h("div", { class: "row" },
            h("div", { class: "field", style: "flex:1;margin:0" }, h("label", { text: "اللغة" }), langSelect),
            h("label", { class: "switch" }, onlyMissing, h("span", { text: "الناقصة فقط" }))
          ),
          h("div", { class: "field", style: "margin-top:10px" }, search),
          h("p", { class: "muted tiny", text: "المفاتيح للقراءة فقط. تُعدَّل القيم فقط، لتبقى بنية الملفات الستة متطابقة." })
        ));
        const enLeaves = leafPaths(messagesFor("en").json || messagesFor("en"));
        const targetMessages = messagesFor(state.textsLang);
        const query = state.textsQuery.trim().toLowerCase();
        const groups = {};
        enLeaves.forEach((leaf) => {
          const targetValue = getByPath(targetMessages, leaf.path);
          const missing = typeof targetValue !== "string" || !targetValue.trim();
          if (state.textsMissingOnly && !missing) return;
          if (query && !(leaf.path.toLowerCase().includes(query) || String(leaf.value).toLowerCase().includes(query) || String(targetValue).toLowerCase().includes(query))) return;
          const group = leaf.path.split(".")[0];
          (groups[group] = groups[group] || []).push({ leaf: leaf, targetValue: targetValue, missing: missing });
        });
        const locale = LOCALES.find((l) => l.code === state.textsLang);
        Object.keys(groups).forEach((group) => {
          const details = h("details", { class: "tree", open: Boolean(query || state.textsMissingOnly) });
          details.append(h("summary", { text: group + " (" + groups[group].length + ")" }));
          const body = h("div", { class: "tree-body" });
          groups[group].forEach((entry) => {
            const reference = entry.leaf.value;
            const warn = typeof reference === "string"
              ? placeholders(reference).filter((token) => !placeholders(entry.targetValue).includes(token))
              : [];
            const area = h("textarea", {
              dir: locale.dir, lang: locale.lang || locale.code,
              value: typeof entry.targetValue === "string" ? entry.targetValue : "",
              oninput: (event) => {
                setByPath(targetMessages, entry.leaf.path, event.target.value);
                addChange("edit", "نص " + state.textsLang.toUpperCase() + " → " + entry.leaf.path, "messages/" + state.textsLang + ".json");
              }
            });
            const leaf = h("div", { class: "leaf" },
              h("div", { class: "path", text: entry.leaf.path }),
              h("div", { class: "ref", text: typeof reference === "string" ? reference : JSON.stringify(reference) }),
              area,
              warn.length ? h("div", { class: "warn", text: "تنبيه: ينقص " + warn.join("، ") }) : null
            );
            if (entry.missing) area.style.borderColor = "#b42318";
            body.append(leaf);
          });
          details.append(body);
          node.append(details);
        });
      }

                  else doDelete();

      async function processImage(file) {
        if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error("الملف يجب أن يكون JPG أو PNG أو WebP.");
        if (file.size > 10 * 1024 * 1024) throw new Error("الملف أكبر من 10MB.");
        const bitmap = await createImageBitmap(file);
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        let max = 1600;
        let blob = null;
        for (let attempt = 0; attempt < 4; attempt++) {
          const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
          const width = Math.max(1, Math.round(bitmap.width * scale));
          const height = Math.max(1, Math.round(bitmap.height * scale));
          canvas.width = width;
          canvas.height = height;
          context.drawImage(bitmap, 0, 0, width, height);
          let quality = 0.82;
          for (let i = 0; i < 3; i++) {
            blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/webp", quality));
            if (!blob) throw new Error("تعذّر تحويل الصورة إلى WebP.");
            if (blob.size <= 500 * 1024) break;
            quality -= 0.12;
          }
          if (blob.size <= 500 * 1024) break;
          max = Math.round(max * 0.8);
        }
        bitmap.close();
        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        const name = "product-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7) + ".webp";
        return {
          name: name,
          path: "public/uploads/products/" + name,
          base64: base64,
          dataUrl: "data:image/webp;base64," + base64,
          size: blob.size
        };
      }

      /* ─────────────────────────── Settings ─────────────────────────── */
      function renderSettings() {
        const node = document.getElementById("screen-settings");
        clear(node);
        const settings = settingsObject();
        const fields = {
          whatsapp: h("input", { dir: "ltr", value: settings.contact.whatsapp || "" }),
          email: h("input", { type: "email", dir: "ltr", value: settings.contact.email || "" }),
          phone: h("input", { dir: "ltr", value: settings.contact.phone || "" }),
          address: h("input", { value: settings.contact.address || "" }),
          cataloguePdf: h("input", { dir: "ltr", value: settings.cataloguePdf || "" })
        };
        const body = h("div", { class: "card" },
          h("div", { class: "field" }, h("label", { text: "واتساب (صيغة دولية: +9647701211099)" }), fields.whatsapp),
          h("div", { class: "field" }, h("label", { text: "البريد الإلكتروني" }), fields.email),
          h("div", { class: "field" }, h("label", { text: "رقم الهاتف للعرض" }), fields.phone),
          h("div", { class: "field" }, h("label", { text: "العنوان (اختياري)" }), fields.address),
          h("div", { class: "field" }, h("label", { text: "رابط PDF الكتالوج (اختياري)" }), fields.cataloguePdf),
          h("p", { class: "muted tiny", text: "الحقل الفارغ يعني أن القناة معطّلة ولن يظهر خيار إرسالها." }),
          h("button", {
            class: "btn primary", type: "button", text: "حفظ الإعدادات",
            onclick: () => {
              settings.contact.whatsapp = fields.whatsapp.value.trim();
              settings.contact.email = fields.email.value.trim();
              settings.contact.phone = fields.phone.value.trim();
              settings.contact.address = fields.address.value.trim();
              settings.cataloguePdf = fields.cataloguePdf.value.trim() || null;
              const problems = validateSettings(settings);
              if (problems.length) { toast(problems.join(" · "), "err"); return; }
              addChange("edit", "تعديل الإعدادات", PATHS.settings);
              toast("تم حفظ الإعدادات في المسودة.", "ok");
            }
          })
        );
        node.append(body);
      }
      function validateSettings(settings) {
        const problems = [];
        const whatsapp = String(settings.contact.whatsapp || "").trim();
        if (whatsapp && !/^\+?\d{8,15}$/.test(whatsapp)) problems.push("صيغة واتساب غير صحيحة");
        const email = String(settings.contact.email || "").trim();
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) problems.push("صيغة البريد غير صحيحة");
        return problems;
      }

      /* ─────────────────────────── Publish ─────────────────────────── */
      function validateAll() {
        const errors = [];
        const warnings = [];
        const products = productsArray();
        const categories = categoriesArray();
        const ids = new Set();
        const categoryIds = new Set(categories.map((c) => c.id));
        const allPaths = new Set(state.images.map((i) => i.path).concat(state.pendingUploads.map((u) => u.path)));
        products.forEach((product, index) => {
          if (!/^[a-z0-9-]+$/.test(product.id || "")) errors.push("معرّف منتج غير صالح: " + product.id);
          if (ids.has(product.id)) errors.push("معرّف مكرر: " + product.id);
          ids.add(product.id);
          if (!categoryIds.has(product.category)) errors.push("فئة غير موجودة للمنتج: " + product.id);
          if (typeof product.order !== "number" || !isFinite(product.order)) errors.push("ترتيب غير صالح للمنتج: " + product.id);
          [product.image].concat(product.gallery || []).filter(Boolean).forEach((path) => {
            if (!allPaths.has(path)) errors.push("صورة غير موجودة: " + path + " (" + product.id + ")");
          });
        });
        const en = messagesFor("en");
        const enLeaves = leafPaths(en).map((leaf) => leaf.path).sort();
        LOCALES.forEach((locale) => {
          const dict = messagesFor(locale.code);
          const leaves = leafPaths(dict).map((leaf) => leaf.path).sort();
          if (JSON.stringify(leaves) !== JSON.stringify(enLeaves)) {
            errors.push("بنية ملف " + locale.code + " لا تطابق الإنجليزية");
          }
        });
        products.forEach((product) => {
          LOCALES.forEach((locale) => {
            const item = messagesFor(locale.code).products.items[product.id];
            if (!item || !String(item.name || "").trim() || !String(item.detail || "").trim()) {
              if (locale.code === "en") errors.push("المنتج " + product.id + " ينقصه الاسم أو الوصف بالإنجليزية");
              else warnings.push("المنتج " + product.id + " ينقصه الاسم أو الوصف بـ " + locale.label);
            }
          });
        });
        validateSettings(settingsObject()).forEach((problem) => errors.push(problem));
        if (!state.changes.length) errors.push("لا توجد تغييرات للنشر.");
        return { errors: errors, warnings: warnings };
      }
      function renderPublish() {
        const node = document.getElementById("screen-publish");
        clear(node);
        const list = h("div", { class: "card" });
        if (!state.changes.length) list.append(h("p", { class: "muted", text: "لا توجد تغييرات بعد." }));
        state.changes.forEach((change) => {
          list.append(h("div", { class: "list-row" },
            h("div", { class: "grow" }, h("div", { class: "title-line", text: change.label }), h("div", { class: "muted tiny", text: change.path })),
            h("span", { class: "badge", text: change.type })
          ));
        });
        const messageInput = h("input", { dir: "ltr", value: "Admin: update content (" + state.changes.length + " changes)" });
        const problems = h("div", {});
        const publishButton = h("button", { class: "btn primary big", type: "button", text: "نشر على GitHub" });
        publishButton.onclick = async () => {
          problems.textContent = "";
          publishButton.disabled = true;
          publishButton.textContent = "جارٍ التحقق...";
          try {
            const result = validateAll();
            if (result.errors.length) {
              problems.append(h("div", { class: "notice error" }, ...result.errors.map((error) => h("div", { text: "• " + error }))));
              return;
            }
            if (result.warnings.length) {
              problems.append(h("div", { class: "notice warn" }, ...result.warnings.map((warning) => h("div", { text: "• " + warning }))));
            }
            publishButton.textContent = "فحص الملفات...";
            for (const path of ALL_JSON_PATHS) {
              if (!state.files[path]) continue;
              const fresh = await readFile(path);
              if (fresh.sha !== state.files[path].sha) {
                modal("تعارض في الملفات", h("p", { class: "muted", text: "الملف تغيّر من مكان ثاني: " + path + ". أعد التحميل قبل النشر." }), [
                  h("button", { class: "btn ghost", type: "button", text: "إغلاق", onclick: closeModal }),
                  h("button", { class: "btn primary", type: "button", text: "إعادة التحميل", onclick: async () => { closeModal(); await enterApp(); } })
                ]);
                return;
              }
            }
            publishButton.textContent = "جارٍ النشر...";
            const byPath = new Map();
            state.changes.filter((change) => ALL_JSON_PATHS.includes(change.path)).forEach((change) => {
              byPath.set(change.path, { path: change.path, content: jsonText(change.path), encoding: "utf-8" });
            });
            state.pendingUploads.forEach((upload) => {
              byPath.set(upload.path, { path: upload.path, content: upload.base64, encoding: "base64" });
            });
            state.imageDeletions.forEach((path) => {
              byPath.set(path, { path: path, remove: true });
            });
            const commit = await commitMany(Array.from(byPath.values()), messageInput.value.trim() || "Admin: update content");
            state.changes = [];
            state.pendingUploads = [];
            state.imageDeletions = [];
            clearDraft();
            for (const path of ALL_JSON_PATHS) state.files[path] = await readFile(path);
            await refreshImages();
            updateBadge();
            renderAll();
            modal("تم النشر بنجاح",
              h("div", {},
                h("div", { class: "notice", text: "الموقع رح يتحدّث خلال حوالي دقيقة." }),
                h("a", { href: "https://github.com/" + OWNER + "/" + REPO + "/commit/" + commit.sha, target: "_blank", rel: "noopener", text: "عرض الـ commit" }),
                h("br"),
                h("a", { href: ACTIONS, target: "_blank", rel: "noopener", text: "فتح GitHub Actions" })
              ),
              [h("button", { class: "btn primary", type: "button", text: "حسناً", onclick: closeModal })]
            );
          } catch (error) {
            problems.append(h("div", { class: "notice error", text: error.message || "تعذّر النشر." }));
          } finally {
            publishButton.disabled = false;
            publishButton.textContent = "نشر على GitHub";
          }
        };
        node.append(
          h("div", { class: "card" }, h("h3", { text: "الملفات والتغييرات" }), list),
          h("div", { class: "card" },
            h("div", { class: "field" }, h("label", { text: "رسالة الـ commit" }), messageInput),
            problems,
            publishButton,
            h("button", {
              class: "btn danger small", type: "button", text: "تجاهل كل التعديلات", style: "margin-top:10px",
              onclick: () => confirmAsk("تجاهل التعديلات", "سيتم إعادة تحميل البيانات من GitHub وفقدان كل التعديلات غير المنشورة.", async () => {
                clearDraft();
                await enterApp();
              }, "تجاهل")
            })
          )
        );
      }

      /* ─────────────────────────── History ─────────────────────────── */
      function renderHistory() {
        const node = document.getElementById("screen-history");
        clear(node);
        const box = h("div", { class: "card" }, h("p", { class: "muted", text: "جارٍ تحميل السجل..." }));
        node.append(box);
        getRecentCommits().then((commits) => {
          clear(box);
          box.append(h("h3", { text: "آخر 15 commit" }));
          (commits || []).forEach((commit) => {
            const restoreMenu = h("select", {});
            restoreMenu.append(h("option", { value: "", text: "استعادة ملف..." }));
            [PATHS.products, ...PATHS.messages].forEach((path) => {
              restoreMenu.append(h("option", { value: path, text: path }));
            });
            restoreMenu.onchange = async () => {
              const path = restoreMenu.value;
              if (!path) return;
              restoreMenu.value = "";
              try {
                const file = await readFile(path, commit.sha);
                state.files[path].json = file.json;
                addChange("restore", "استعادة " + path, path);
                toast("تمت الاستعادة في المسودة. انشرها لإنشاء commit جديد.", "ok");
              } catch (error) { toast(error.message, "err"); }
            };
            box.append(h("div", { class: "list-row" },
              h("div", { class: "grow" },
                h("div", { class: "title-line", text: commit.commit.message.split("\n")[0] }),
                h("div", { class: "muted tiny", text: new Date(commit.commit.author.date).toLocaleString("ar") + " — " + (commit.author ? commit.author.login : commit.commit.author.name) })
              ),
              h("div", { class: "actions" },
                h("a", { class: "btn ghost small", href: commit.html_url, target: "_blank", rel: "noopener", text: "عرض" }),
                restoreMenu
              )
            ));
          });
        }).catch((error) => {
          clear(box);
          box.append(h("div", { class: "notice error", text: error.message }));
        });
      }

      /* ─────────────────────────── Wire static buttons ─────────────────── */
      document.getElementById("btnLogoutTop").addEventListener("click", lockSession);
      document.getElementById("btnLogoutSide").addEventListener("click", lockSession);
      document.getElementById("btnForgetSide").addEventListener("click", forgetDevice);

      showLogin();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - DIAMOND Cleaning</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header></header>
    <main class="container py-xl">
        <h1 data-i18n="cart_title">Shopping Cart</h1>
        <div id="cart-items" class="mt-lg mb-lg"></div>
        <div style="text-align: right; font-size: 1.5rem; font-weight: bold;">
            <span data-i18n="cart_total">Total</span>: <span id="cart-total"></span>
        </div>
        <div style="text-align: right; margin-top: var(--spacing-md);">
            <button class="btn btn-accent" data-i18n="cart_checkout">Checkout / Inquiry</button>
        </div>
    </main>
    <footer></footer>
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
